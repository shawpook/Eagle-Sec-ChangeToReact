<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
  <canvas id="frame" width="160" height="90"></canvas>
  <script>
    window.createVideoFixture = async function createVideoFixture() {
      const canvas = document.getElementById('frame');
      const context = canvas.getContext('2d');
      const stream = canvas.captureStream(10);
      const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
        .find((type) => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error('WebM MediaRecorder is unavailable');
      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 300000 });
      recorder.ondataavailable = (event) => { if (event.data.size > 0) chunks.push(event.data); };
      const stopped = new Promise((resolve, reject) => {
        recorder.onstop = resolve;
        recorder.onerror = () => reject(recorder.error || new Error('MediaRecorder failed'));
      });
      recorder.start(100);
      const startedAt = performance.now();
      while (performance.now() - startedAt < 1200) {
        const elapsed = performance.now() - startedAt;
        const firstHalf = elapsed < 600;
        context.fillStyle = firstHalf ? '#d92828' : '#285bd9';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = firstHalf ? '#ffffff' : '#f7dc39';
        context.beginPath();
        context.arc(firstHalf ? 40 : 120, 45, 24, 0, Math.PI * 2);
        context.fill();
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      recorder.stop();
      await stopped;
      stream.getTracks().forEach((track) => track.stop());
      const blob = new Blob(chunks, { type: mimeType });
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Unable to encode fixture'));
        reader.readAsDataURL(blob);
      });
    };
  </script>
</body>
</html>
