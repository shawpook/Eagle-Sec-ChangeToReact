<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<!-- b1-9af：React 接管——jquery + exif-player.js 摘除，控制面迁至
		     react/viewers/exif/entry.tsx（vite 中间件注入 React 入口与 preamble） -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
		<title></title>
		<style>
			html, body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			body {
				pointer-events: none;
				margin: 0;
				text-align: center;
			}
			img {
			    position: absolute;
			    top: 50%;
			    left: 50%;
			    transform: translateX(-50%) translateY(-50%);
			    /*border-radius: 3px;*/
			    opacity: 0;
			    transition: opacity ease-in-out 75ms;
			    image-rendering: auto;
			    /*backface-visibility: hidden;*/
    			/*outline: 1px solid transparent;*/
			}
			img.pixelated {
				/*image-rendering: pixelated;*/
				image-rendering: -webkit-optimize-contrast;
			}
			img.fit-height {
				max-height: 100vh;
			}
			img.fit-height2 {
				max-height: 100vw;
			}
			img.fit-width {
				max-width: 100vw;
			}
			img.fit-width2 {
				max-width: 100vh;
			}
			img.r8 {
			    transform: translateX(-50%) translateY(-50%) rotate(-90deg);
			}
			img.r7 {
			    transform: translateX(-50%) translateY(-50%) rotate(-270deg) scaleX(-1);
			}
			img.r6 {
			    transform: translateX(-50%) translateY(-50%) rotate(90deg);
			}
			img.r5 {
			    transform: translateX(-50%) translateY(-50%) rotate(270deg) scaleX(-1);
			}
			img.r4 {
			    transform: translateX(-50%) translateY(-50%) scaleY(-1);
			}
			img.r3 {
			    transform: translateX(-50%) translateY(-50%) scaleX(-1) scaleY(-1);
			}
			img.r2 {
			    transform: translateX(-50%) translateY(-50%) scaleX(-1);
			}
			img.show {
				opacity: 1;
			}
		</style>
	</head>

	<body>
		<div id="exif-root"></div>
	</body>
</html>
