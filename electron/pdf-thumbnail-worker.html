<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="../../src/app/pdf-viewer/build/pdf.js"></script>
</head>
<body>
  <canvas id="page"></canvas>
  <script>
    window.renderPdfThumbnail = async function renderPdfThumbnail(sourceUrl, maxSize, maxImagePixels) {
      const loadingTask = window.pdfjsLib.getDocument({
        url: sourceUrl,
        disableAutoFetch: true,
        disableFontFace: false,
        disableRange: true,
        disableStream: true,
        isEvalSupported: false,
        maxImageSize: maxImagePixels,
      });
      const documentProxy = await loadingTask.promise;
      const page = await documentProxy.getPage(1);
      const originalViewport = page.getViewport({ scale: 1 });
      const scale = Math.min(maxSize / originalViewport.width, maxSize / originalViewport.height, 1);
      const viewport = page.getViewport({ scale: Math.max(scale, 0.01) });
      const canvas = document.getElementById('page');
      canvas.width = Math.max(1, Math.ceil(viewport.width));
      canvas.height = Math.max(1, Math.ceil(viewport.height));
      const context = canvas.getContext('2d', { alpha: false });
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: context, viewport, intent: 'display' }).promise;
      const result = {
        dataUrl: canvas.toDataURL('image/png'),
        width: Math.max(1, Math.round(originalViewport.width)),
        height: Math.max(1, Math.round(originalViewport.height)),
        pages: documentProxy.numPages,
      };
      page.cleanup();
      await documentProxy.destroy();
      return result;
    };
  </script>
</body>
</html>
