<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Eagle Reverse Collector</title>
  <style>
    body { width: 260px; margin: 0; padding: 14px; background: #1d2024; color: #e8eaed; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 15px; }
    button { display: block; width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 6px; background: #4f8cff; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #3a4149; }
    .status { min-height: 18px; margin-top: 10px; color: #3ecf8e; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Eagle Reverse Collector</h1>
  <button id="collectPage">Collect Page</button>
  <button id="collectImage">Collect Selected Image</button>
  <button id="openWorkbench" class="secondary">Open Workbench</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
