	<script>
		function trimCanvas(c) {
			var ctx = c.getContext('2d'),
				copy = document.createElement('canvas').getContext('2d'),
				pixels = ctx.getImageData(0, 0, c.width, c.height),
				l = pixels.data.length,
				i,
				bound = {
					top: null,
					left: null,
					right: null,
					bottom: null
				},
				x, y;
			
			// Iterate over every pixel to find the highest
			// and where it ends on every axis ()
			for (i = 0; i < l; i += 4) {
				if (pixels.data[i + 3] !== 0) {
					x = (i / 4) % c.width;
					y = ~~((i / 4) / c.width);

					if (bound.top === null) {
						bound.top = y;
					}

					if (bound.left === null) {
						bound.left = x;
					} else if (x < bound.left) {
						bound.left = x;
					}

					if (bound.right === null) {
						bound.right = x;
					} else if (bound.right < x) {
						bound.right = x;
					}

					if (bound.bottom === null) {
						bound.bottom = y;
					} else if (bound.bottom < y) {
						bound.bottom = y;
					}
				}
			}
			
			var trimHeight = bound.bottom - bound.top,
				trimWidth = bound.right - bound.left,
				trimmed = ctx.getImageData(bound.left, bound.top, trimWidth, trimHeight);

			copy.canvas.width = trimWidth;
			copy.canvas.height = trimHeight;
			copy.putImageData(trimmed, 0, 0);

			return copy.canvas;
		}
	</script>

    <script type="text/javascript">
		jQuery(document).ready(function () {
			jQuery(window).on("keyup", function (e) {
				if (e.keyCode === 27) {
					parent.postMessage("Exit", "*")
				}
				else if (e.keyCode === 37) {
					parent.postMessage("Prev", "*")
				}
				else if (e.keyCode === 39) {
					parent.postMessage("Next", "*")
				}
			});
		})
        OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
            console.log ({
                eventName : eventName,
                eventLabel : eventLabel,
                eventParams : eventParams
            });
			const CALLBACK_FUN_NAME = window.frameElement.getAttribute("callback");
			switch(eventName) {
				case "theme_on_load":
					setTimeout(() => {
						// $("body").css("--ov_background_color", "trasparent");
						// show grid
						// $(".ov_toggle.ov_sidebar_parameter_toggle").first().not(".on").click();
						// dark mode
						$(".ov_toggle.ov_sidebar_parameter_toggle").last().not(".on").click();
						$("body").addClass("show");
					}, 50);
					break;
				case "edge_display_changed":
					break;
				case "import_failed":
					if (parent[CALLBACK_FUN_NAME]) parent[CALLBACK_FUN_NAME](eventParams?.error_message);
					break;
				case "failed_to_load_file":
					if (parent[CALLBACK_FUN_NAME]) parent[CALLBACK_FUN_NAME](eventParams?.error_message);
					break;
				case "model_loaded":
					$(".ov_sidebar_parameter:contains(Background Image)").hide();
					if (window.frameElement) {
						
						setTimeout(() => {
							if (!hasCallback) {
								if (parent[CALLBACK_FUN_NAME]) {
									parent[CALLBACK_FUN_NAME](new Error("process timeout"));
								}
							}
						}, 30000);

						if (parent[CALLBACK_FUN_NAME]) {
							let canvas = document.querySelector("canvas#viewer");
							let base64 = canvas.toDataURL();
							let trimmedCanvas = document.createElement('canvas');
							trimmedCanvas.width = canvas.width;
							trimmedCanvas.height = canvas.height;
							let trimmedCtx = trimmedCanvas.getContext('2d');
							let img = new Image();
							img.onload = function () {
								try {
									trimmedCtx.drawImage(img, 0, 0, trimmedCanvas.width, trimmedCanvas.height);
									trimmedCanvas = trimCanvas(trimmedCanvas);
									let resultCanvas = document.createElement('canvas');
									let resultCtx = resultCanvas.getContext("2d");
									resultCanvas.width = trimmedCanvas.width + 80;
									resultCanvas.height = trimmedCanvas.height + 80;
									resultCtx.drawImage(trimmedCanvas, 40, 40, trimmedCanvas.width, trimmedCanvas.height);
									let trimmedBase64 = resultCanvas.toDataURL("image/webp", 0.75);
									parent[CALLBACK_FUN_NAME](undefined, trimmedBase64);
								}
								catch (err) {
									parent[CALLBACK_FUN_NAME](err);
								}
							};
							img.onerror = function () {
								parent[CALLBACK_FUN_NAME](undefined, base64);
							}
							img.src = base64;
						}
					}
					break;
			}
			
        });
    </script>
