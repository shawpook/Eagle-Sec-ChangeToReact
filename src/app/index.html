<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="shortcut icon" , href="icon.svg" , type="image/x-icon">
    <link rel="stylesheet" href="css/modules/angular-notify/angular-notify.min.css">
    <link rel="stylesheet" href="css/vendors/sweetalert2/sweetalert2.min.css">
    <title>Eagle</title>
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link rel="stylesheet" href="css/icons.css">
    <link id="app-style" rel="stylesheet" href="css/style_dark.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/modules/flatpicker/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="css/modules/flatpicker/themes/airbnb.css">
    <link rel="stylesheet" href="css/modules/nouislider/nouislider.min.css">
    <link href="css/vendors/videojs/video-js.css" rel="stylesheet">
    <link href="js/vendors/colorpicker/css/colorpicker.css" rel="stylesheet">
</head>
<body
    tabindex="-1"
>

    <!-- 应用菜单按钮（React 接管，舊區塊已刪；11-pre a8） -->
    <div id="eagle-app-menu-host"></div>

    <div id="main-app">

        <!-- 側邊欄 -->
        <div class="hover-show-sidebar"></div>
        <div id="sidebar" class="sidebar" resizable="e" on-resize="onSidebarResize(event, ui)" ondragleave="onDragLeaveSidebar(event)">
</div>

        <!-- 網頁瀏覽器（React 接管，舊 WebsitePanelController 區塊已刪） -->
        <div id="eagle-website-panel-host"></div>

        <!-- 圖片列表 -->
        <div id="list-content-panel" class="content-panel">

            <!-- 文件写入进度条 + 檔案添加進度條（React 接管，舊區塊已刪；11-pre a1） -->
            <div id="eagle-progress-bars-host"></div>

            <!-- 搜寻自动提示 -->
            <div id="eagle-search-suggestions-host" class="search-suggestions"></div>

            <!-- 列表模式工具列 -->
            <div id="eagle-toolbar-host" class="toolbar"></div>

            <!-- 失败重试提示 / 本地服务器警告 / 資源庫寫入權限提示（React 接管，舊區塊已刪；11-pre a2） -->
            <div id="eagle-toast-alerts-host"></div>

            <!-- 篩選工具列 -->
            <div id="eagle-filter-toolbar-host" class="filter-toolbar"></div>
            <div id="filter-toolbar-overlay" class="filter-toolbar-overlay"></div>

            <!-- 自定义滚轴 -->
            <div id="box-container-scrollbar" class="box-container-scrollbar">
                <div class="box-container-scrollbar-thumb"></div>
            </div>

            <!-- 標籤管理（React 接管，舊 <tag-manager> 島已刪） -->
            <div id="eagle-tag-manager-host"></div>

            <!-- scroll-to-top（React 接管，舊區塊已刪；11-pre a4） -->
            <div id="eagle-scroll-top-host"></div>

            <!-- 图片列表页面 -->
            <div id="box-container" class="box-container grid-layout">
                <!-- Scroll to top sentinel for main content -->
                <div id="scroll-to-top-sentinel"
                     target="#scroll-to-top"
                     threshold="200"
                     scroll-container="#box-container"></div>
                
                <!-- 空状态六种（React 接管，舊區塊已刪；11-pre a4） -->
                <div id="eagle-drop-areas-host"></div>
                <div id="eagle-folder-lock-host"></div>

                <!-- 內容列表 -->
                <!-- 文件夹列表（React 接管，舊區塊已刪；11-pre a5） -->
                <div id="eagle-sub-folder-host"></div>
                <!-- 列表列头（React 接管，舊區塊已刪；11-pre a6） -->
                <div id="eagle-list-header-host"></div>
                    <div
						id="box-list"
                        class="box-list"
                    >
                    </div>
            </div>
            <!-- 面板拖放浮层（React 接管，舊區塊已刪；11-pre a9） -->
            <div id="eagle-panel-droparea-host"></div>
        </div>

        <!-- 詳情模式（React 接管，舊區塊已刪；11-pre a8） -->
        <div id="eagle-detail-wrapper-host"></div>
        
        <!-- 檢查器（React 接管，舊 <inspector> 元素與模板已刪） -->
        <div id="eagle-inspector-host"></div>
        
        
        <!-- 快速搜尋（React 接管，舊 <quick-search-modal> 元素已刪） -->
        <div id="eagle-quick-search-host" class="modal-flex-center"></div>
        <!-- 批次重新命名（React 接管，舊 <batch-rename-modal> 已刪） -->
        <div id="eagle-batch-rename-host" class="modal-flex-center"></div>
        <!-- Artstation 匯入（React 接管，舊 <artstation-import-modal> 已刪） -->
        <div id="eagle-artstation-import-host"></div>

        <!-- 图片分类窗口 / 文件夹移动窗口（React 接管，舊 AddToFolderController / MoveFolderController 區塊已刪） -->
        <div id="eagle-add-to-folder-host" class="modal-flex-center"></div>
        <div id="eagle-move-folder-host" class="modal-flex-center"></div>

        <!-- 自動標籤窗口（React 接管，舊 AutoTaggingController 區塊已刪） -->
        <div id="eagle-auto-tagging-host" class="modal-flex-center"></div>

        <!-- 智能文件夾彈窗（React 接管，舊 NewSmartFolderController 區塊已刪） -->
        <div id="eagle-smart-folder-host" class="modal-flex-center"></div>


        <!-- 錯誤提示彈窗（React 接管，舊 ErrorModalController 區塊已刪） -->
        <div id="eagle-error-modal-host" class="modal-flex-center"></div>
        <!-- 批次收藏面板（React 接管，舊 <batch-save-panel> 已刪） -->
        <div id="eagle-batch-save-panel-host"></div>
		<!-- 插件面板（React 接管，舊 <plugin-panel> 已刪） -->
		<div id="eagle-plugin-panel-host"></div>
		<!-- 插件建立器（React 接管，舊 <plugin-creator> 已刪） -->
		<div id="eagle-plugin-creator-host" class="modal-flex-center"></div>
		<!-- 插件中心（React 接管，舊 <plugin-center> 已刪） -->
		<div id="eagle-plugin-center-host" class="modal-flex-center"></div>
        <!-- 佈局面板（React 接管） -->
        <div id="eagle-layout-panel-host"></div>
        <!-- 資料夾選擇面板（React 接管，舊 <folder-select-panel> 島已刪） -->
        <div id="eagle-folder-select-panel-host"></div>
        <!-- 標籤選擇面板（React 接管，舊 <general-tag-select-panel> 島已刪） -->
        <div id="eagle-general-tag-select-panel-host"></div>
        <!-- 檢查器標籤選擇面板（React 接管，舊 <inspector-tag-select-panel> 島已刪） -->
        <div id="eagle-inspector-tag-select-panel-host"></div>
        <!-- 重複檔案掃描面板（React 接管，舊 <duplicate-scan-panel> 已刪） -->
        <div id="eagle-duplicate-scan-panel-host"></div>
        <!-- 重複檔案彈窗（React 接管，舊 <duplicate-modal> 已刪） -->
        <div id="eagle-duplicate-modal-host"></div>
        <!-- 滚轮引导（React 接管） -->
        <div id="eagle-mousewheel-modal-host"></div>
        <!-- 右鍵選單（React 接管，舊 <context-menu> 元素已刪） -->
        <div id="eagle-context-menu-host"></div>
        <!-- 文件夹密码（React 接管） -->
        <div id="eagle-folder-password-host"></div>
        <!-- 通知中心（React 接管） -->
        <div id="eagle-notification-host"></div>
    </div>


    <!-- 歡迎頁面（React 接管） -->
    <div id="eagle-welcome-host"></div>

    <!-- 新版提示（React 接管） -->
    <div id="eagle-newversion-host"></div>

    <!-- 關於（React 接管） -->
    <div id="eagle-about-host"></div>

    <library-panel theme="theme" library-history="libraryHistory"></library-panel>

    <!-- 進度條（React 接管，舊 <empty-trash-progress> 等已刪） -->
    <div id="eagle-empty-trash-progress-host"></div>
    <div id="eagle-library-load-progress-host"></div>
    <div id="eagle-library-merge-progress-host"></div>
    <div id="eagle-eaglepack-import-progress-host"></div>
    <div id="eagle-eaglepack-export-progress-host"></div>
    <div id="eagle-file-thumbnail-progress-host"></div>
    <div id="eagle-file-export-progress-host"></div>
    <div id="eagle-file-add-library-progress-host"></div>
    <div id="eagle-debug-report-progress-host"></div>
    <div id="eagle-webp-convert-progress-host"></div>
    <div id="eagle-fixutil-clean-empty-folder-progress-host"></div>
    <div id="eagle-fixutil-progress-host"></div>


    <!-- 应用锁密码输入（React 接管，舊區塊已刪；11-pre a3） -->
    <div id="eagle-app-lock-host"></div>

    <div id="multiple-drag-placeholder"></div>

    <!-- 取色器（React 接管，舊區塊已刪；11-pre a7） -->
    <div id="eagle-colors-picker-host"></div>

    <!-- 圖片標注（React 接管，舊區塊已刪；11-pre a7） -->
    <div id="eagle-annotation-preview-host"></div>

    <!-- 懸停預覽 -->
    <div id="hover-preview-container">
        <div class="image-wraper">
            <img src="">
        </div>
        <div class="hover-preview-container-overlay"></div>
    </div>

    <div id="tag-manager-drag-badge" class="tag-manager-drag-badge"></div>

    <script src="js/lib/eagle-api.js"></script>
    <script src="js/lib/api/url-enlarger.js"></script>
    <script src="js/vendors/tippy.js"></script>
    <script src="js/vendors/jquery-1.8.0.min.js"></script>
    <!-- jQuery UI 定制构建（含 resizable/sortable/draggable/droppable）：原框架同类依赖，
         此前仅引了 css/jquery-ui.min.css 而漏引本脚本 → React 侧 `jQuery(el).resizable(...)`
         / `.sortable(...)` 抛 "is not a function"，React 18 无 error boundary 时整树被卸载
         （表现：#eagle-react-host 空、#eagle-inspector-host .inspector 不存在）。 -->
    <script src="js/vendors/jquery-ui.min.js"></script>
    <script src="js/vendors/jquery-long-click.js"></script>
    <script src="js/vendors/jquery.bez.js"></script>
    <script src="js/vendors/lodash.js"></script>
    <script src="js/vendors/mousetrap.min.js"></script>
    <!-- jquery-audio（$.playSound / $.stopSound）同属 app.bundle.js 内联件，b1-9d 摘除 bundle
         后消失；scope 的 removeSound/duplicateSound/errorSound.play() 直调该插件。 -->
    <script src="js/vendors/jquery-audio.js"></script>
    <!-- sweetalert2（window.swal / window.sweetAlert）同属 app.bundle.js 内联 vendor，b1-9d
         摘除 bundle 后消失；ProgressDialogs/ControllerModals/miscDomain 等的 w.swal(...) 确认
         /输入弹窗全部被 ngSafe/try-catch 吞成静默 no-op，swal2 容器永不出现。vendor 文件尾部
         自带 window.sweetAlert=window.swal=window.Sweetalert2 别名（CSS 已在 head:10）。 -->
    <script src="js/vendors/sweetalert2/sweetalert2.all.min.js"></script>
    <!-- artstation-download（window.Artstation，b1-9m）——原 b1 前由 index.html 引入的独立
         全局（顶层 var），BatchRenameArtstationModals 的 vaildateUrl 读
         Artstation.isValidUrl；摘除引入后 blur 校验链抛 ReferenceError 被吞、url-error 永不显示。 -->
    <script src="js/artstation-download.js"></script>
    <script>
        if (typeof module === 'object') { window.module = module; module = undefined; }
        if (window.module) module = window.module;
        var appRoot = require('app-root-path');
        window.i18n = new(require(appRoot + '/i18n'));
        window.EagleConfig = require(appRoot + '/config.js');
    </script>
    <script src="js/services/lazy-load-manager.js"></script>
    <!-- smoothZoom（详情原图缩放 / BitmapViewer / bitmapWorker 瓦片链）原本内联在
         app.bundle.js 里；b1-9d 摘除 bundle 后 $.fn.smoothZoom 与 BitmapViewer 一并消失 →
         machineryEnterDetailMode 的初始化静默 no-op → 无 #bitmap-viewer canvas、无瓦片 →
         详情交付闸门超时。载入 /vendor 提取版（应用层胶水的 angular.element 依赖已换等价物，
         见该文件头注）。必须同步加载：fetch 注入会与进详情抢跑。 -->
    <script src="/vendor/eagle-smooth-zoom.js"></script>
    <script src="js/services/shortcut-manager.js"></script>
    <script src="js/vendors/colorpicker/js/colorpicker.js"></script>
    <script src="js/vendors/colorpicker/js/eye.js"></script>
    <script src="js/vendors/colorpicker/js/utils.js"></script>
    <script>
        eagle.urlEnlargerRemote.load();
    </script>
</body>
</html>
