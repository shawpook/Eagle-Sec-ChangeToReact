	<script>
		function throttle(fn, delay, immediate, debounce) {
			var curr = +new Date(),
				last_call = 0,
				last_exec = 0,
				timer = null,
				diff,
				context,
				args,
				exec = function() {
					last_exec = curr;
					fn.apply(context, args);
				};
			return function() {
				curr = +new Date();
				context = this,
					args = arguments,
					diff = curr - (debounce ? last_call : last_exec) - delay;
				clearTimeout(timer);
				if (debounce) {
					if (immediate) {
						timer = setTimeout(exec, delay);
					} else if (diff >= 0) {
						exec();
					}
				} else {
					if (diff >= 0) {
						exec();
					} else if (immediate) {
						timer = setTimeout(exec, -diff);
					}
				}
				last_call = curr;
			}
		};

		function debounce(func, wait, immediate) {
			var timeout;
			return function() {
				var context = this,
					args = arguments;
				var later = function() {
					timeout = null;
					if (!immediate) func.apply(context, args);
				};
				var callNow = immediate && !timeout;
				clearTimeout(timeout);
				timeout = setTimeout(later, wait);
				if (callNow) func.apply(context, args);
			};
		};
	</script>
