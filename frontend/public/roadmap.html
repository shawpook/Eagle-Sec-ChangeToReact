<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eagle Roadmap Panels</title>
  <style>
    :root {
      --bg: #131518;
      --panel: #1b1e22;
      --panel-2: #22262b;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --line: #33383f;
      --accent: #4f8cff;
      --green: #3ecf8e;
      --danger: #e26d5a;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .links a { color: var(--accent); margin-left: 10px; text-decoration: none; }
    nav {
      display: flex;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      overflow-x: auto;
    }
    nav button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    nav button.active { border-color: var(--accent); background: #25344d; color: #cfe0ff; }
    main {
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    label { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 54px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button.secondary { background: #3a4149; }
    button.danger { background: var(--danger); }
    button.small { padding: 5px 9px; font-size: 12px; }
    select[multiple] { min-height: 120px; }
    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 12px;
      margin-top: 8px;
    }
    .error { color: var(--danger); }
    .progress-shell {
      height: 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 180ms ease;
    }
    .group {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--panel-2);
    }
    .group .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line);
    }
    .group .list-item:last-child { border-bottom: 0; }
    .plugin-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .plugin-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      padding: 10px;
    }
    .plugin-card .name { font-weight: 600; overflow-wrap: anywhere; }
    .plugin-card .meta { color: var(--muted); font-size: 12px; margin: 6px 0; }
    .result-list { max-height: 320px; overflow: auto; }
    .result-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2b3138;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 860px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Eagle Roadmap Panels</h1>
      <div class="muted" id="libraryStatus">Loading library</div>
    </div>
    <div class="links">
      <a href="/pages.html">Pages</a>
      <a href="/workbench.html">Workbench</a>
      <a href="/src/app/index.html" target="_blank">Main UI</a>
      <a href="/src/app/preferences.html" target="_blank">Preferences</a>
    </div>
  </header>
  <nav id="tabs" aria-label="Roadmap tasks">
    <button class="active" data-tab="A">A 批量管理</button>
    <button data-tab="B">B 重复扫描</button>
    <button data-tab="C">C Inspector</button>
    <button data-tab="D">D 筛选搜索</button>
    <button data-tab="E">E Eaglepack</button>
    <button data-tab="F">F 插件中心</button>
  </nav>
  <main>
    <section id="panel-A" class="panel active">
      <div class="card">
        <h2>Batch Management</h2>
        <div class="grid3">
          <div>
            <label>Items</label>
            <select id="batchItems" multiple></select>
            <div class="row" style="margin-top:8px;">
              <button class="secondary small" id="selectAllItems">All</button>
              <button class="secondary small" id="clearItems">Clear</button>
            </div>
          </div>
          <div>
            <h2>Rename</h2>
            <label>Mode</label>
            <select id="renameMode">
              <option value="format">Format</option>
              <option value="replace">Replace</option>
            </select>
            <label>Format / Replace</label>
            <input id="renameFormat" value="* - %NN" placeholder="* - %NN">
            <label>Start Index</label>
            <input id="renameStart" type="number" min="0" value="1">
            <label>Find</label>
            <input id="renameFind" placeholder="old">
            <label>Replace</label>
            <input id="renameReplace" placeholder="new">
            <label>Text Case</label>
            <select id="renameTextCase">
              <option value="none">None</option>
              <option value="uppercase">Uppercase</option>
              <option value="lowercase">Lowercase</option>
              <option value="capitalize">Capitalize</option>
            </select>
            <button id="batchRenameButton" style="margin-top:10px;">Batch Rename</button>
          </div>
          <div>
            <h2>Update</h2>
            <label>Tags</label>
            <input id="batchTags" placeholder="UI, 收藏">
            <label>Annotation</label>
            <textarea id="batchAnnotation"></textarea>
            <label>URL</label>
            <input id="batchUrl" placeholder="https://">
            <label>Star</label>
            <input id="batchStar" type="number" min="0" max="5" value="">
            <button id="batchUpdateButton" style="margin-top:10px;">Batch Update</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Folders &amp; Password</h2>
        <div class="grid3">
          <div>
            <label>Target Folder</label>
            <select id="folderSelect"></select>
            <label>Assignment</label>
            <select id="folderMode">
              <option value="add">Add</option>
              <option value="move">Move</option>
            </select>
            <button id="assignFolderButton" style="margin-top:10px;">Assign Folder</button>
          </div>
          <div>
            <label>New Password</label>
            <input id="folderPassword" type="password">
            <label>Current Password</label>
            <input id="folderCurrentPassword" type="password">
            <div class="row" style="margin-top:10px;">
              <button class="secondary" id="setFolderPassword">Set</button>
              <button class="secondary" id="verifyFolderPassword">Verify</button>
              <button class="secondary" id="changeFolderPassword">Change</button>
              <button class="danger" id="removeFolderPassword">Remove</button>
            </div>
          </div>
          <div>
            <h2>Tags</h2>
            <label>Tag Name</label>
            <input id="tagSource" placeholder="UI">
            <label>New Name / Merge Target</label>
            <input id="tagTarget" placeholder="Interface">
            <div class="row" style="margin-top:10px;">
              <button class="secondary" id="renameTagButton">Rename</button>
              <button class="secondary" id="mergeTagButton">Merge</button>
            </div>
          </div>
        </div>
        <div class="status" id="panelAStatus"></div>
      </div>
    </section>

    <section id="panel-B" class="panel">
      <div class="card">
        <h2>Duplicate Scan &amp; Merge</h2>
        <div class="grid2">
          <div>
            <label>Method</label>
            <select id="duplicateMethod">
              <option value="same">Exact</option>
              <option value="similar">Similar</option>
            </select>
            <label>Similarity Threshold</label>
            <input id="duplicateThreshold" type="number" min="0" max="1" step="0.05" value="0.55">
            <button id="scanDuplicatesButton" style="margin-top:10px;">Scan Duplicates</button>
          </div>
          <div>
            <div class="progress-shell"><div class="progress-bar" id="duplicateProgress"></div></div>
            <div class="status" id="duplicateStatus"></div>
          </div>
        </div>
        <div id="duplicateGroups"></div>
      </div>
    </section>

    <section id="panel-C" class="panel">
      <div class="card">
        <h2>Inspector Edit</h2>
        <div class="grid2">
          <div>
            <label>Item</label>
            <select id="inspectorItem"></select>
            <label>Name</label>
            <input id="inspectorName">
            <label>Annotation</label>
            <textarea id="inspectorAnnotation"></textarea>
            <label>URL</label>
            <input id="inspectorUrl">
          </div>
          <div>
            <label>Tags</label>
            <input id="inspectorTags" placeholder="UI, 收藏">
            <label>Folders</label>
            <select id="inspectorFolders" multiple></select>
            <label>Star</label>
            <input id="inspectorStar" type="number" min="0" max="5" value="0">
            <label>Comments</label>
            <textarea id="inspectorComments" placeholder="one comment per line"></textarea>
            <button id="saveInspectorButton" style="margin-top:10px;">Save Inspector</button>
          </div>
        </div>
        <div class="status" id="inspectorStatus"></div>
      </div>
    </section>

    <section id="panel-D" class="panel">
      <div class="card">
        <h2>Quick Search</h2>
        <div class="row">
          <input id="quickKeyword" placeholder="name / tag / annotation / url" style="max-width:420px;">
          <button id="quickSearchButton">Search</button>
        </div>
        <div id="quickResults" class="result-list"></div>
      </div>
      <div class="card">
        <h2>Filters</h2>
        <div class="grid3">
          <div>
            <label>Keyword</label>
            <input id="filterKeyword">
            <label>Tags</label>
            <input id="filterTags">
            <label>Color</label>
            <input id="filterColor" type="color" value="#4f8cff">
            <label>Type</label>
            <select id="filterExt">
              <option value="">Any</option>
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
              <option value="gif">GIF</option>
              <option value="webp">WebP</option>
              <option value="mp4">Video</option>
              <option value="mp3">Audio</option>
              <option value="ttf">Font</option>
              <option value="pdf">PDF</option>
            </select>
          </div>
          <div>
            <label>Min Width</label>
            <input id="filterMinWidth" type="number" min="0" value="">
            <label>Max Width</label>
            <input id="filterMaxWidth" type="number" min="0" value="">
            <label>Min Height</label>
            <input id="filterMinHeight" type="number" min="0" value="">
            <label>Max Height</label>
            <input id="filterMaxHeight" type="number" min="0" value="">
          </div>
          <div>
            <label>Star</label>
            <input id="filterStar" type="number" min="0" max="5" value="">
            <label>Date From</label>
            <input id="filterDateFrom" type="date">
            <label>Date To</label>
            <input id="filterDateTo" type="date">
            <label>Options</label>
            <div class="row">
              <label style="margin:0;"><input id="filterHasAnnotation" type="checkbox"> Annotation</label>
              <label style="margin:0;"><input id="filterHasUrl" type="checkbox"> URL</label>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="applyFilters">Apply Filters</button>
          <button class="secondary" id="resetFilters">Reset</button>
          <span class="muted" id="filterCount"></span>
        </div>
        <div id="filterResults" class="result-list"></div>
      </div>
    </section>

    <section id="panel-E" class="panel">
      <div class="card">
        <h2>Eaglepack Progress</h2>
        <div class="grid2">
          <div>
            <label>Export Destination</label>
            <input id="eaglepackDest" placeholder="optional absolute path">
            <button id="startExportJob" style="margin-top:10px;">Start Export Job</button>
          </div>
          <div>
            <label>Import File</label>
            <input id="eaglepackImportFile" placeholder="C:\path\library.eaglepack">
            <label>Mode</label>
            <select id="eaglepackMode">
              <option value="replace">Replace</option>
              <option value="merge">Merge</option>
            </select>
            <button id="startImportJob" style="margin-top:10px;">Start Import Job</button>
          </div>
        </div>
        <div class="progress-shell"><div class="progress-bar" id="jobProgress"></div></div>
        <div class="status" id="jobStatus"></div>
      </div>
    </section>

    <section id="panel-F" class="panel">
      <div class="card">
        <h2>Plugin Center</h2>
        <div class="grid2">
          <div>
            <button class="secondary" id="refreshPlugins">Refresh</button>
            <div id="pluginList" class="plugin-list"></div>
          </div>
          <div>
            <h2>Detail</h2>
            <pre id="pluginDetail" class="muted" style="white-space:pre-wrap;min-height:120px;">Select a plugin</pre>
            <label>Plugin Package Path</label>
            <input id="pluginPackagePath" placeholder="C:\path\plugin.eagleplugin">
            <button id="installPluginButton" style="margin-top:10px;">Install</button>
            <label>Source Directory</label>
            <input id="pluginSourceDir" placeholder="C:\path\plugin-source">
            <button id="packPluginButton" style="margin-top:10px;">Pack</button>
          </div>
        </div>
        <div class="status" id="pluginStatus"></div>
      </div>
    </section>
  </main>

  <script>
    const API = 'http://127.0.0.1:41695';
    const $ = (id) => document.getElementById(id);
    let items = [];
    let folders = [];
    let plugins = [];
    let currentJobTimer = null;

    async function api(path, options = {}) {
      const res = await fetch(API + path, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.status !== 'success') throw new Error(body.message || `HTTP ${res.status}`);
      return body.data;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function flattenFolders(tree = folders, depth = 0) {
      return (tree || []).flatMap((folder) => [
        { ...folder, depth },
        ...flattenFolders(folder.children || [], depth + 1),
      ]);
    }

    function selectedBatchIds() {
      return Array.from($('batchItems').selectedOptions).map((option) => option.value);
    }

    function parseCsv(value) {
      return String(value || '').split(',').map((entry) => entry.trim()).filter(Boolean);
    }

    function showTab(name) {
      document.querySelectorAll('.panel').forEach((panel) => panel.classList.remove('active'));
      document.querySelectorAll('nav button').forEach((button) => button.classList.toggle('active', button.dataset.tab === name));
      $(`panel-${name}`).classList.add('active');
    }

    document.querySelectorAll('nav button').forEach((button) => {
      button.addEventListener('click', () => showTab(button.dataset.tab));
    });

    function renderItems() {
      $('batchItems').innerHTML = items.map((item) =>
        `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)} [${escapeHtml(item.ext)}]</option>`
      ).join('');
      $('inspectorItem').innerHTML = items.map((item) =>
        `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`
      ).join('');
      $('libraryStatus').textContent = `Library: ${items.length} items`;
    }

    function renderFolders() {
      const flat = flattenFolders();
      const options = flat.map((folder) =>
        `<option value="${escapeHtml(folder.id)}">${'  '.repeat(folder.depth)}${escapeHtml(folder.name)}</option>`
      ).join('');
      $('folderSelect').innerHTML = options;
      $('inspectorFolders').innerHTML = options;
    }

    async function loadItems() {
      items = await api('/api/item/list');
      renderItems();
    }

    async function loadFolders() {
      folders = await api('/api/folder/list');
      renderFolders();
    }

    async function loadPlugins() {
      const data = await api('/api/plugins/center');
      plugins = data.plugins || [];
      renderPlugins();
    }

    function renderPlugins() {
      $('pluginList').innerHTML = plugins.map((plugin) => `
        <div class="plugin-card">
          <div class="name">${escapeHtml(plugin.name)}</div>
          <div class="meta">${escapeHtml(plugin.id)} · ${escapeHtml(plugin.version || '-')}${plugin.installed ? ' · installed' : ''}</div>
          <div class="row">
            <button class="secondary small" data-plugin-open="${escapeHtml(plugin.id)}">Open</button>
            <button class="secondary small" data-plugin-detail="${escapeHtml(plugin.id)}">Detail</button>
            ${plugin.installed ? `<button class="danger small" data-plugin-uninstall="${escapeHtml(plugin.id)}">Uninstall</button>` : ''}
          </div>
        </div>
      `).join('') || '<div class="muted">No plugins found</div>';
      document.querySelectorAll('[data-plugin-open]').forEach((button) => {
        button.addEventListener('click', () => openPlugin(button.getAttribute('data-plugin-open')));
      });
      document.querySelectorAll('[data-plugin-detail]').forEach((button) => {
        button.addEventListener('click', () => showPluginDetail(button.getAttribute('data-plugin-detail')));
      });
      document.querySelectorAll('[data-plugin-uninstall]').forEach((button) => {
        button.addEventListener('click', () => uninstallPlugin(button.getAttribute('data-plugin-uninstall')));
      });
    }

    async function openPlugin(id) {
      try {
        const data = await api('/api/plugins/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        window.open(data.url, '_blank');
        statusText('pluginStatus', `Opened ${id}`);
      } catch (err) {
        statusText('pluginStatus', err.message, true);
      }
    }

    async function showPluginDetail(id) {
      const plugin = plugins.find((entry) => entry.id === id) || await api(`/api/plugins/${encodeURIComponent(id)}`);
      $('pluginDetail').textContent = JSON.stringify(plugin, null, 2);
    }

    async function uninstallPlugin(id) {
      try {
        await api('/api/plugins/uninstall', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        statusText('pluginStatus', `Uninstalled ${id}`);
        await loadPlugins();
      } catch (err) {
        statusText('pluginStatus', err.message, true);
      }
    }

    function statusText(id, text, isError = false) {
      const element = $(id);
      element.textContent = text;
      element.classList.toggle('error', isError);
    }

    $('selectAllItems').addEventListener('click', () => {
      Array.from($('batchItems').options).forEach((option) => { option.selected = true; });
    });
    $('clearItems').addEventListener('click', () => {
      Array.from($('batchItems').options).forEach((option) => { option.selected = false; });
    });

    $('batchRenameButton').addEventListener('click', async () => {
      const ids = selectedBatchIds();
      if (ids.length === 0) return statusText('panelAStatus', 'Select items first', true);
      try {
        const changed = await api('/api/item/batchRename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ids,
            mode: $('renameMode').value,
            format: $('renameFormat').value,
            startAt: Number($('renameStart').value),
            find: $('renameFind').value,
            replace: $('renameReplace').value,
            textCase: $('renameTextCase').value,
          }),
        });
        statusText('panelAStatus', `Renamed ${changed.length} items`);
        await loadItems();
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    $('batchUpdateButton').addEventListener('click', async () => {
      const ids = selectedBatchIds();
      if (ids.length === 0) return statusText('panelAStatus', 'Select items first', true);
      const patch = {};
      const tags = parseCsv($('batchTags').value);
      const annotation = $('batchAnnotation').value;
      const url = $('batchUrl').value;
      const star = $('batchStar').value;
      if (tags.length > 0) patch.tags = tags;
      if (annotation !== '') patch.annotation = annotation;
      if (url !== '') patch.url = url;
      if (star !== '') patch.star = Number(star);
      if (Object.keys(patch).length === 0) return statusText('panelAStatus', 'Enter at least one update field', true);
      try {
        const changed = await api('/api/item/batchUpdate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids, patch }),
        });
        statusText('panelAStatus', `Updated ${changed.length} items`);
        await loadItems();
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    $('assignFolderButton').addEventListener('click', async () => {
      const ids = selectedBatchIds();
      const folderId = $('folderSelect').value;
      if (ids.length === 0 || !folderId) return statusText('panelAStatus', 'Select items and folder', true);
      try {
        const changed = await api('/api/item/addToFolder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids, folderID: folderId, mode: $('folderMode').value }),
        });
        statusText('panelAStatus', `Assigned ${changed.length} items`);
        await loadItems();
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    async function folderPasswordAction(action, body) {
      try {
        const data = await api(action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        statusText('panelAStatus', JSON.stringify(data));
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    }

    $('setFolderPassword').addEventListener('click', () => {
      const folderId = $('folderSelect').value;
      const password = $('folderPassword').value;
      if (!folderId || !password) return statusText('panelAStatus', 'Select folder and enter password', true);
      folderPasswordAction('/api/folder/setPassword', { folderID: folderId, password });
    });

    $('verifyFolderPassword').addEventListener('click', async () => {
      const folderId = $('folderSelect').value;
      const password = $('folderPassword').value;
      if (!folderId || !password) return statusText('panelAStatus', 'Select folder and enter password', true);
      try {
        const valid = await api('/api/folder/verifyPassword', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folderID: folderId, password }),
        });
        statusText('panelAStatus', valid ? 'Password valid' : 'Password invalid', !valid);
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    $('changeFolderPassword').addEventListener('click', () => {
      const folderId = $('folderSelect').value;
      const password = $('folderPassword').value;
      const currentPassword = $('folderCurrentPassword').value;
      if (!folderId || !password || !currentPassword) return statusText('panelAStatus', 'Enter current and new password', true);
      folderPasswordAction('/api/folder/changePassword', { folderID: folderId, currentPassword, password });
    });

    $('removeFolderPassword').addEventListener('click', () => {
      const folderId = $('folderSelect').value;
      if (!folderId) return statusText('panelAStatus', 'Select folder', true);
      folderPasswordAction('/api/folder/removePassword', { folderID: folderId });
    });

    $('renameTagButton').addEventListener('click', async () => {
      const source = $('tagSource').value;
      const target = $('tagTarget').value;
      if (!source || !target) return statusText('panelAStatus', 'Enter tag names', true);
      try {
        await api('/api/tag/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: source, newName: target }),
        });
        statusText('panelAStatus', `Renamed tag ${source}`);
        await loadItems();
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    $('mergeTagButton').addEventListener('click', async () => {
      const source = $('tagSource').value;
      const target = $('tagTarget').value;
      if (!source || !target) return statusText('panelAStatus', 'Enter tag names', true);
      try {
        await api('/api/tag/merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source, target }),
        });
        statusText('panelAStatus', `Merged tag ${source} into ${target}`);
        await loadItems();
      } catch (err) {
        statusText('panelAStatus', err.message, true);
      }
    });

    $('scanDuplicatesButton').addEventListener('click', async () => {
      const ids = selectedBatchIds();
      $('duplicateProgress').style.width = '0%';
      statusText('duplicateStatus', 'Scanning...');
      const timer = setInterval(() => {
        const current = Number($('duplicateProgress').style.width.replace('%', '')) || 0;
        $('duplicateProgress').style.width = `${Math.min(92, current + 14)}%`;
      }, 120);
      try {
        const data = await api('/api/item/duplicates/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: $('duplicateMethod').value,
            threshold: Number($('duplicateThreshold').value),
            ids,
          }),
        });
        clearInterval(timer);
        $('duplicateProgress').style.width = '100%';
        renderDuplicateGroups(data.groups);
        statusText('duplicateStatus', `Scanned ${data.scanned} items, ${data.groups.length} groups`);
      } catch (err) {
        clearInterval(timer);
        statusText('duplicateStatus', err.message, true);
      }
    });

    function renderDuplicateGroups(groups) {
      if (groups.length === 0) {
        $('duplicateGroups').innerHTML = '<div class="muted">No duplicate groups</div>';
        return;
      }
      $('duplicateGroups').innerHTML = groups.map((group, index) => `
        <div class="group">
          <div class="row" style="justify-content:space-between;">
            <strong>Group ${index + 1}</strong>
            <span class="muted">${group.items.length} items</span>
          </div>
          ${group.items.map((entry) => `<div class="list-item"><span>${escapeHtml(entry.name)}</span><span class="pill">${escapeHtml(entry.size)}</span></div>`).join('')}
          <div class="row" style="margin-top:8px;">
            <label style="margin:0;">Keep</label>
            <select id="keep-${index}" style="max-width:260px;">
              ${group.items.map((entry) => `<option value="${escapeHtml(entry.id)}">${escapeHtml(entry.name)}</option>`).join('')}
            </select>
            <button class="danger small" data-merge-index="${index}">Merge</button>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('[data-merge-index]').forEach((button) => {
        button.addEventListener('click', async () => {
          const index = Number(button.getAttribute('data-merge-index'));
          const group = groups[index];
          const keepId = $(`keep-${index}`).value;
          const ids = group.items.map((entry) => entry.id);
          try {
            await api('/api/item/mergeDuplicates', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ids, keepId }),
            });
            statusText('duplicateStatus', 'Merged');
            await loadItems();
            $('scanDuplicatesButton').click();
          } catch (err) {
            statusText('duplicateStatus', err.message, true);
          }
        });
      });
    }

    $('inspectorItem').addEventListener('change', () => {
      const item = items.find((entry) => entry.id === $('inspectorItem').value);
      if (!item) return;
      $('inspectorName').value = item.name || '';
      $('inspectorAnnotation').value = item.annotation || '';
      $('inspectorUrl').value = item.url || '';
      $('inspectorTags').value = (item.tags || []).join(', ');
      $('inspectorStar').value = item.star || 0;
      $('inspectorComments').value = (item.comments || []).map((comment) => comment.text || '').join('\n');
      Array.from($('inspectorFolders').options).forEach((option) => {
        option.selected = (item.folders || []).includes(option.value);
      });
    });

    $('saveInspectorButton').addEventListener('click', async () => {
      const id = $('inspectorItem').value;
      if (!id) return statusText('inspectorStatus', 'Select an item', true);
      try {
        const comments = $('inspectorComments').value.split('\n').map((text) => text.trim()).filter(Boolean)
          .map((text) => ({ id: `COMMENT-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, text, modificationTime: Date.now() }));
        await api('/api/item/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id,
            name: $('inspectorName').value,
            annotation: $('inspectorAnnotation').value,
            url: $('inspectorUrl').value,
            tags: parseCsv($('inspectorTags').value),
            folders: Array.from($('inspectorFolders').selectedOptions).map((option) => option.value),
            star: Number($('inspectorStar').value),
            comments,
          }),
        });
        statusText('inspectorStatus', 'Saved');
        await loadItems();
      } catch (err) {
        statusText('inspectorStatus', err.message, true);
      }
    });

    async function renderSearchResults(list, target) {
      $(target).innerHTML = list.map((item) => `
        <div class="result-item">
          <div>
            <div>${escapeHtml(item.name)}</div>
            <div class="muted">${escapeHtml((item.tags || []).join(', '))}</div>
          </div>
          <a class="pill" href="/src/app/preview-window.html?id=${encodeURIComponent(item.id)}" target="_blank">Preview</a>
        </div>
      `).join('') || '<div class="muted">No results</div>';
    }

    $('quickSearchButton').addEventListener('click', async () => {
      const keyword = $('quickKeyword').value;
      const results = await api(`/api/item/search?keyword=${encodeURIComponent(keyword)}`);
      await renderSearchResults(results, 'quickResults');
    });

    $('quickKeyword').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') $('quickSearchButton').click();
    });

    $('applyFilters').addEventListener('click', async () => {
      const params = new URLSearchParams();
      const set = (key, value) => { if (value !== '' && value != null) params.set(key, value); };
      set('keyword', $('filterKeyword').value);
      set('tags', $('filterTags').value);
      if ($('filterColor').value && $('filterColor').value !== '#4f8cff') set('color', $('filterColor').value);
      set('ext', $('filterExt').value);
      set('minWidth', $('filterMinWidth').value);
      set('maxWidth', $('filterMaxWidth').value);
      set('minHeight', $('filterMinHeight').value);
      set('maxHeight', $('filterMaxHeight').value);
      set('star', $('filterStar').value);
      set('dateFrom', $('filterDateFrom').value);
      set('dateTo', $('filterDateTo').value);
      if ($('filterHasAnnotation').checked) params.set('hasAnnotation', 'true');
      if ($('filterHasUrl').checked) params.set('hasUrl', 'true');
      const results = await api(`/api/item/search?${params.toString()}`);
      $('filterCount').textContent = `${results.length} items`;
      await renderSearchResults(results, 'filterResults');
    });

    $('resetFilters').addEventListener('click', () => {
      ['filterKeyword', 'filterTags', 'filterMinWidth', 'filterMaxWidth', 'filterMinHeight', 'filterMaxHeight', 'filterStar', 'filterDateFrom', 'filterDateTo'].forEach((id) => $(id).value = '');
      $('filterColor').value = '#4f8cff';
      $('filterExt').value = '';
      $('filterHasAnnotation').checked = false;
      $('filterHasUrl').checked = false;
      $('filterCount').textContent = '';
      $('filterResults').innerHTML = '';
    });

    function pollJob(jobId) {
      clearInterval(currentJobTimer);
      currentJobTimer = setInterval(async () => {
        try {
          const job = await api(`/api/jobs/${encodeURIComponent(jobId)}`);
          $('jobProgress').style.width = `${job.progress || 0}%`;
          statusText('jobStatus', `${job.type} ${job.status}: ${job.message}`);
          if (job.status === 'complete' || job.status === 'error') {
            clearInterval(currentJobTimer);
            $('jobProgress').style.width = job.status === 'error' ? '100%' : '100%';
            if (job.result) statusText('jobStatus', JSON.stringify(job.result));
          }
        } catch (err) {
          clearInterval(currentJobTimer);
          statusText('jobStatus', err.message, true);
        }
      }, 300);
    }

    $('startExportJob').addEventListener('click', async () => {
      try {
        const data = await api('/api/export/eaglepack/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ destFile: $('eaglepackDest').value || undefined }),
        });
        pollJob(data.job.id);
      } catch (err) {
        statusText('jobStatus', err.message, true);
      }
    });

    $('startImportJob').addEventListener('click', async () => {
      const file = $('eaglepackImportFile').value;
      if (!file) return statusText('jobStatus', 'Enter import file path', true);
      try {
        const data = await api('/api/import/eaglepack/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file, mode: $('eaglepackMode').value }),
        });
        pollJob(data.job.id);
      } catch (err) {
        statusText('jobStatus', err.message, true);
      }
    });

    $('refreshPlugins').addEventListener('click', loadPlugins);

    $('installPluginButton').addEventListener('click', async () => {
      const file = $('pluginPackagePath').value;
      if (!file) return statusText('pluginStatus', 'Enter plugin package path', true);
      try {
        const installed = await api('/api/plugins/install', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file }),
        });
        statusText('pluginStatus', `Installed ${installed.name || installed.id}`);
        await loadPlugins();
      } catch (err) {
        statusText('pluginStatus', err.message, true);
      }
    });

    $('packPluginButton').addEventListener('click', async () => {
      const sourceDir = $('pluginSourceDir').value;
      if (!sourceDir) return statusText('pluginStatus', 'Enter plugin source directory', true);
      try {
        const data = await api('/api/plugins/pack', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceDir }),
        });
        statusText('pluginStatus', `Packed -> ${data.path}`);
      } catch (err) {
        statusText('pluginStatus', err.message, true);
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        showTab('D');
        $('quickKeyword').focus();
      }
    });

    (async () => {
      await Promise.all([loadItems(), loadFolders(), loadPlugins()]);
      $('inspectorItem').dispatchEvent(new Event('change'));
    })();
  </script>
</body>
</html>
