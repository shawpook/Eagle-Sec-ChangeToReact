<!DOCTYPE html>

  <style>
    body {
      margin: 0;

      background: #17181b;
      color: #f2f3f5;
      font: 14px/1.6 system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    main {
      width: min(760px, calc(100vw - 40px));
      padding: 32px 28px;
      border: 1px solid #33363b;
      border-radius: 8px;
      background: #1f2023;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 24px;
      color: #9aa0a6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    a {
      display: block;
      padding: 12px 14px;
      border: 1px solid #36393f;
      border-radius: 6px;
      color: #e8eaed;
      text-decoration: none;
    }
    a:hover {
      border-color: #5b8def;
      background: #262a31;
    }
