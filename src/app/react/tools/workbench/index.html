<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eagle Reverse Workbench</title>
  <!-- M5-1（F22）：地址由当前服务进程在请求期给出，页面本身不含端口常量。 -->
  <script src="/eagle-runtime-config.js"></script>
  <style>
    :root {
      --bg: #141619;
      --panel: #1d2024;
      --panel-2: #24282d;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --line: #343a41;
      --accent: #4f8cff;
      --green: #3ecf8e;
      --orange: #f2a65a;
      --danger: #e26d5a;
      --radius: 8px;
    }
    :root[data-theme="light"] {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --panel-2: #eef0f3;
      --text: #1a1d21;
      --muted: #5f6670;
      --line: #d7dbe1;
      --accent: #2f6fe4;
      --green: #148f59;
      --orange: #b8751d;
      --danger: #c43d2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 280px;
      gap: 16px;
      padding: 16px;
      max-width: 1600px;
      margin: 0 auto;
    }
    aside, main { min-width: 0; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    section h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    label { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 54px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button.secondary { background: #3a4149; }
    button.danger { background: var(--danger); }
    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .icon-btn img { width: 18px; height: 18px; pointer-events: none; }
    .icon-btn.active { outline: 2px solid var(--accent); }
    #menuPopover {
      display: none;
      position: fixed;
      top: 52px;
      left: 12px;
      z-index: 40;
      min-width: 200px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }
    #menuPopover.visible { display: block; }
    #menuPopover button {
      width: 100%;
      margin: 0 0 4px;
      text-align: left;
      background: transparent;
      color: var(--text);
    }
    #menuPopover button:hover { background: var(--panel-2); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .status {
      min-height: 18px;
      color: var(--green);
      font-size: 12px;
      margin-top: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .item-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      overflow: hidden;
    }
    .item-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #101215;
    }
    /* M8-4：缩略图缺图的占位。与上面的 .item-card img 同形（4/3、#101215 空底色）
       —— 页内没有任何既有类能给出这个盒子（.muted 只有颜色、.pill 是内联小胶囊），
       故补一条同形规则，保证换成占位后网格几何不塌、也不出现视觉跳变。
       文字沿用既有 .muted 语言（同 "No items" 空态）。 */
    .item-card .thumb-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101215;
      font-size: 12px;
      overflow: hidden;
    }
    .item-card .meta { padding: 8px 10px; }
    .item-card .name { font-weight: 600; overflow-wrap: anywhere; }
    .item-card .tags { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .list-view {
      grid-template-columns: 1fr;
    }
    .list-view .item-card {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      align-items: center;
      gap: 12px;
    }
    .list-view .item-card img { width: 92px; aspect-ratio: 4 / 3; object-fit: cover; }
    .list-view .item-card .thumb-placeholder { width: 92px; }
    .item-card { cursor: pointer; }
    .item-card.selected { outline: 2px solid var(--accent); }
    #dropOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 22px;
      pointer-events: none;
    }
    #dropOverlay.visible { display: flex; }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .list-item:last-child { border-bottom: 0; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2b3138;
      color: var(--muted);
      font-size: 12px;
    }
    a { color: var(--accent); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
    /* M5-1（F17）：React 挂载点不参与布局，header/menuPopover/dropOverlay/.layout
       仍是 body 的直属盒子，盒子树与迁移前一致。 */
    #root { display: contents; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/react/tools/workbench/entry.tsx"></script>
</body>
</html>
