<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="css/modules/angular-notify/angular-notify.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/preview-window-new.css">
    <link rel="stylesheet" href="css/preview-window.css">

    <script>
    var appRoot = require('app-root-path');
    window.i18n = new(require(appRoot + '/i18n'));
    </script>

    <!-- 阶段9a：preview-window.js（classic script）顶层 const 原本形成全局词法绑定，供页面级
         代码解析裸标识符（global.js FileUrlHelper 的裸 path、getClipboardImage 的裸 clipboard 等）。
         React 化后该文件不再加载，由本脚本以 window 属性等价提供（裸标识符解析兜底到全局对象，
         classic/module 消费方皆可见）。 -->
    <script>
    window.path = require('path');
    window.fs = require('fs');
    // EagleConfig 同为 global.js 顶层 const（全局词法绑定，非 window 属性）——controller 的
    // VIDEO/AUDIO/MODEL/FONT/URL_TYPES 表与 web-view 的 USER_AGENT 依赖它
    window.EagleConfig = require(appRoot + '/config.js');
    try { window.fse = require('fs-extra'); } catch (err) {}
    window.electron = require('electron');
    window.shell = window.electron.shell;
    window.clipboard = window.electron.clipboard;
    window.ipcRenderer = window.electron.ipcRenderer;
    try {
        window.remote = require('@electron/remote');
        window.Menu = window.remote.Menu;
        window.MenuItem = window.remote.MenuItem;
        window.currentWindow = window.remote.getCurrentWindow();
        window.USER_DATA_PATH = (window.remote.app && window.remote.app.getPath('userData')) || '';
    } catch (err) {}
    window.EAGLE_THUMBNAIL_TEMP_PATH = window.path.normalize((window.USER_DATA_PATH || '') + '/eagle-temp');
    try { window.electronSettings = require(appRoot + '/my_modules/electron-settings'); } catch (err) {}
    </script>
    <script src="js/vendors/tippy.js"></script>
    <script src="js/vendors/jquery-1.8.0.min.js"></script>
    <script src="js/vendors/jquery-ui.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/devices.js"></script>
    <!-- b1-9bv-A：mousetrap.min.js（v1.6.3）退役——自研 keymap（react/core/keymap.ts），
         preview bundle 不走 installBundleGlobals，由 preview-window/entry.tsx 模块求值期
         installKeymap() 供给 window.Mousetrap（usePreviewMousetrap 消费面，契约见
         PROGRESS P2-bv）。 -->
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link href="js/vendors/videojs/video-js.css" rel="stylesheet">
    <script src="js/vendors/videojs/video.js"></script>
    <script src="js/vendors/videojs/lang/en.js"></script>
    <script src="js/vendors/videojs/lang/zh_TW.js"></script>
    <script src="js/vendors/videojs/lang/zh_CN.js"></script>
    <script src="js/vendors/videojs/lang/ko_KR.js"></script>
    <script src="js/vendors/videojs/lang/ja_JP.js"></script>
    <script src="js/services/shortcut-manager.js"></script>
</head>

<body id="preview-window" class=" hide-toolbar">
    <!-- Shift 拖拽模式（静态壳：controller initShellBehaviors 的 jQuery 委托目标，元素身份永不重建） -->
    <div id="drag-mode-overlay"></div>
    <div class="drag-area"></div>

    <!-- 工具列（React portal：#eagle-preview-toolbar-anchor） -->
    <div id="eagle-preview-toolbar-anchor"></div>

    <!-- 內容容器（静态壳；#detail-container 身份永不重建——smoothZoom wrap 关系，同阶段5 详情模式） -->
    <div class="container" style="position: fixed; z-index: 9999;">
        <!-- Toast 提示 + 无法支持预览的文件（React portal：#eagle-preview-content-anchor） -->
        <div id="eagle-preview-content-anchor"></div>
        <div id="detail-container" mouse-gesture="" image="current" rect="commentRect" class="box-container"></div>
    </div>

    <!-- Gif 播放器工具列（React portal：#eagle-preview-footbar-anchor） -->
    <div id="eagle-preview-footbar-anchor"></div>

    <!-- React 入口宿主（entry.tsx 挂载点；渲染内容全部经 portal 进上方四锚点） -->
    <div id="eagle-preview-react-host"></div>
</body>

</html>
