<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Waveform</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #101215; color: #e8eaed; font: 14px system-ui, sans-serif; display: grid; place-items: center; }
    main { width: min(960px, calc(100vw - 32px)); padding: 20px; border: 1px solid #343a41; border-radius: 8px; background: #1d2024; }
    audio { width: 100%; }
    canvas { width: 100%; height: 220px; margin-top: 12px; border-radius: 8px; background: #24282d; }
    .muted { color: #9aa3ad; }
  </style>
</head>
<body>
  <main>
    <h1>Audio Waveform</h1>
    <p class="muted" id="pathLabel">No file</p>
    <audio id="player" controls></audio>
    <canvas id="waveform"></canvas>
  </main>
  <script>
    const src = new URLSearchParams(location.search).get('path');
    const label = document.querySelector('#pathLabel');
    const player = document.querySelector('#player');
    const canvas = document.querySelector('#waveform');
    if (!src) label.textContent = 'No file';
    else {
      label.textContent = decodeURIComponent(src);
      player.src = src;
      fetch(src)
        .then((res) => res.arrayBuffer())
        .then((buffer) => {
          const context = new AudioContext();
          return context.decodeAudioData(buffer);
        })
        .then((audioBuffer) => {
          const data = audioBuffer.getChannelData(0);
          const ctx = canvas.getContext('2d');
          const width = canvas.width = canvas.clientWidth;
          const height = canvas.height = canvas.clientHeight;
          const step = Math.ceil(data.length / width);
          ctx.fillStyle = '#24282d';
          ctx.fillRect(0, 0, width, height);
          ctx.strokeStyle = '#3ecf8e';
          ctx.beginPath();
          for (let x = 0; x < width; x += 1) {
            let min = 1;
            let max = -1;
            for (let i = 0; i < step; i += 1) {
              const value = data[x * step + i] || 0;
              if (value < min) min = value;
              if (value > max) max = value;
            }
            const y1 = height / 2 + min * height / 2;
            const y2 = height / 2 + max * height / 2;
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
          }
          ctx.stroke();
        })
        .catch((err) => { label.textContent = 'Waveform error: ' + err.message; });
    }
  </script>
</body>
</html>
