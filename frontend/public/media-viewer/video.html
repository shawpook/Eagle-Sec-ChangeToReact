<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Preview</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #101215; color: #e8eaed; font: 14px system-ui, sans-serif; display: grid; place-items: center; }
    main { width: min(960px, calc(100vw - 32px)); padding: 20px; border: 1px solid #343a41; border-radius: 8px; background: #1d2024; }
    video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
    .muted { color: #9aa3ad; }
  </style>
</head>
<body>
  <main>
    <h1>Video Preview</h1>
    <p class="muted" id="pathLabel">No file</p>
    <video id="player" controls autoplay muted></video>
  </main>
  <script>
    const src = new URLSearchParams(location.search).get('path');
    if (src) {
      document.querySelector('#pathLabel').textContent = decodeURIComponent(src);
      document.querySelector('#player').src = src;
    }
  </script>
</body>
</html>
