		     且该路径本就不存在（404），本地副本 collect-window/css/jquery-ui.min.css 亦无引用。 -->

		     逐字移植为 react/collect-window/api/*.ts，由入口的 installCollectApi() 在模块求值期
		     装配（顺序与键集由 stage9b1 的 pw4g 断言钉住）。fetch 经 shims 重写 41595→测试后端。

		<div id="eagle-collect-react-host"></div>

		<script src="js/vendors/chinese_convert.js"></script>
		<script src="js/vendors/pinyinlite.js"></script>
		<script src="js/vendors/tiny-pinyin.js"></script>

	<script type="module" src="/src/app/react/collect-window/entry.tsx"></script>
