<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="content-type" content="text/html;charset=utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<link rel="icon" type="image/png" href="assets/images/3dviewer_net_favicon.ico">

	<title>Online 3D Viewer Embedded</title>

	<!-- meta start -->
	<!-- meta end -->

	<!-- website start -->
	<link rel="stylesheet" type="text/css" href="css/icons.css">
	<link rel="stylesheet" type="text/css" href="css/themes.css">
	<link rel="stylesheet" type="text/css" href="css/core.css">
	<link rel="stylesheet" type="text/css" href="css/controls.css">
	<link rel="stylesheet" type="text/css" href="css/dialogs.css">
	<link rel="stylesheet" type="text/css" href="css/treeview.css">
	<link rel="stylesheet" type="text/css" href="css/panelset.css">
	<link rel="stylesheet" type="text/css" href="css/navigator.css">
	<link rel="stylesheet" type="text/css" href="css/sidebar.css">
	<link rel="stylesheet" type="text/css" href="css/website.css">
	<link rel="stylesheet" type="text/css" href="css/embed.css">
	<!-- R5：引擎脚本路径修正——原 ../build/o3dv.website.min-dev.js 指向不存在的 dev 构建
	     （src/app/model-viewer 下只有 libs/ 与 website/，无 build/）。该 404 会让 OV 未定义，
	     紧随其后的 SetWebsiteEventHandler/StartEmbed 全抛错。同引擎页 index.html:21 用的是
	     ../libs/o3dv.website.min.js（该库文件内含 StartEmbed 面），此处对齐同一路径。 -->
	<script type="text/javascript" src="../libs/o3dv.website.min.js"></script>
	<!-- website end -->

	<!-- analytics start -->
    <script type="text/javascript">
        OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
            console.log ({
                eventName : eventName,
                eventLabel : eventLabel,
                eventParams : eventParams
            });
        });
    </script>
	<!-- analytics end -->

    <!-- embed init start -->
    <script type="text/javascript">
        OV.StartEmbed ('../libs');
    </script>
    <!-- embed init end -->

	<style>
		html, body
		{
			background: transparent;
		}
	</style>
</head>

<body>
	<div class="embed_viewer" id="embed_viewer">
		<a id="website_link" href="https://3dviewer.net" target="_blank" title="Open in 3dviewer.net">
			<svg class="embed_logo"><use href="assets/images/3dviewer_net_logo.svg#logo"></use></svg>
		</a>
	</div>
</body>

</html>
