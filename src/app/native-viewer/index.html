<!-- 使用原生方式動態瀏覽特殊格式 -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<script src="../js/vendors/jquery-1.8.0.min.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
		<title>Native Viewer</title>
		<style>

			html, body {
				margin: 0;
				overflow: hidden;
				pointer-events: none;
			    width: 100%;
    			height: 100%;
			}

			body {
				margin: 0;
				text-align: center;
			}

			body.ready #loader {
				display: none;
			}

			#preview {
				position: absolute;
				top: 0;
				left: 0;
				pointer-events: none;
			    width: 100%;
    			height: 100%;
    			/*image-rendering: -webkit-optimize-contrast*/
			}

			#preview[src=""] {
				display:none;
			}

			.loader {
				z-index: 10;
				position: absolute;
				bottom: 12px;
				right: 12px;
				transform: translateX(-50%) translateY(-50%);
				background-color: rgba(40, 40, 40, 0.8);
				padding: 5px;
				border-radius: 5px;
			}
			.spinner {
			  -webkit-animation: rotator 1.4s linear infinite;
			          animation: rotator 1.4s linear infinite;
			}

			@-webkit-keyframes rotator {
			  0% {
			    -webkit-transform: rotate(0deg);
			            transform: rotate(0deg);
			  }
			  100% {
			    -webkit-transform: rotate(270deg);
			            transform: rotate(270deg);
			  }
			}

			@keyframes rotator {
			  0% {
			    -webkit-transform: rotate(0deg);
			            transform: rotate(0deg);
			  }
			  100% {
			    -webkit-transform: rotate(270deg);
			            transform: rotate(270deg);
			  }
			}
			.path {
			  stroke-dasharray: 187;
			  stroke-dashoffset: 0;
			  stroke: #fff;
			  -webkit-transform-origin: center;
			      -ms-transform-origin: center;
			          transform-origin: center;
			  -webkit-animation: dash 1.4s ease-in-out infinite;
			          animation: dash 1.4s ease-in-out infinite;
			}

			@-webkit-keyframes dash {
			  0% {
			    stroke-dashoffset: 187;
			  }
			  50% {
			    stroke-dashoffset: 46.75;
			    -webkit-transform: rotate(135deg);
			            transform: rotate(135deg);
			  }
			  100% {
			    stroke-dashoffset: 187;
			    -webkit-transform: rotate(450deg);
			            transform: rotate(450deg);
			  }
			}
			@keyframes dash {
			  0% {
			    stroke-dashoffset: 187;
			  }
			  50% {
			    stroke-dashoffset: 46.75;
			    -webkit-transform: rotate(135deg);
			            transform: rotate(135deg);
			  }
			  100% {
			    stroke-dashoffset: 187;
			    -webkit-transform: rotate(450deg);
			            transform: rotate(450deg);
			  }
			}


		</style>
	</head>

	<body>
		<img id="preview" alt="" src="" />

		<div id="loader" class="loader">
	        <svg class="spinner" width="12px" height="12px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
	            <circle class="path" fill="none" stroke-width="3" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
	        </svg>
	    </div>

		<script type="text/javascript">

			var MAX_DIMENSION = 120000000;

			var $parentScope = window.parent.$bodyScope;
			var urlParams = window.location.search.substr(1).split('&').reduce(function(accumulator, currentValue) {
		            var pair = currentValue
		                .split('=')
		                .map(function(value) {
		                    return decodeURIComponent(value);
		                });

		            accumulator[pair[0]] = pair[1];
		            return accumulator;
		        },
		        {}
		    );

			const isAppleSilicon = parent.process.platform === "darwin" && parent.process.arch === "arm64";
		    var p = urlParams.path;
		    var fileName = urlParams.name;
			// var fileName = encodeURIComponent(urlParams.name);
		    var filePath = decodeURIComponent(p) + fileName;
		    var id = urlParams.id;
		    var ext = urlParams.ext;
		    var height = parseInt(urlParams.height);
		    var width = parseInt(urlParams.width);
		    var size = Math.max(height, width) || 8192;

		    const path = window.parent.require("path");
			const fs = window.parent.require("fs");
			const spawn = window.parent.require('child_process').spawn;
		    var tempFolder = `${window.parent.global.EAGLE_THUMBNAIL_TEMP_PATH}/preview`;
    		var finalPath = path.normalize(tempFolder + "/" + id + ".png");
    		var previewLink = finalPath.replace(/#/g, '%23');

		    function removeDirAllFiles(dir) {
			    if (!dir) return;
			    fs.readdir(dir, function(err, files) {
			        if (err) return;
			        files.forEach(function (file) {
			            fs.unlink(path.join(dir, file), function(err) {});
			        });
			    });
			}

			var pollingInterval;
			function polling (src, ducation) {
				var $img = $("#preview");
				var errorTimeout;
				$img.on("error", function () {
					$img.css("opacity", 0);
					clearTimeout(errorTimeout);
					errorTimeout = setTimeout(function () {
						$img.attr("src", src + "?d=" + Date.now());
						console.log("文件不存在，继续轮询")
					}, 1000);
				});
				$img.on("load", function () {
					$img.css("opacity", 1);
					$("body").addClass("ready");
					console.log("文件已存在，停止轮询")
				});
				$img.attr("src", src);
			}

			if (window.parent.process.platform === 'darwin') {
				$(document).ready(function () {

					setTimeout(function () {
						init();
					}, 500);

					function init () {

						var tempPath = path.normalize(tempFolder + "/" + decodeURIComponent(fileName) + ".png");

						if (height * width > MAX_DIMENSION) { 
							$("body").addClass("ready");
							return; 
						}

						if (Math.min(width, height) < 600) { 
							$("body").addClass("ready");
							return; 
						}

					    if ("psd psdt psb ai exr hdr graffle mindnode ppt pptx doc docx xls xlsx numbers key pages dwg".indexOf(ext) === -1) {
					    	$("body").addClass("ready");
					    	return;
					    }

					    // 如果预览图时间 < 当前文件时间，就移除缓存
					    try {
					    	var fp = filePath;
					    	var rawStat = fs.statSync(fp);
					    	var finalStat = fs.statSync(finalPath);
					    	if (rawStat.mtimeMs > finalStat.mtimeMs) {
					    		fs.unlinkSync(finalPath);
					    		console.log("预览图过旧，重新制作");
					    	}
					    }
					    catch (err) {
					    	console.log(err);
					    }
					    

					    // 缓存机制
					    if (!fs.existsSync(finalPath)) {
					    	if (!fs.existsSync(tempFolder)) {
						    	fs.mkdirSync(tempFolder);
						    }

						    // 避免太多缓存，超过一定量时，进行清理
						    tempFiles = fs.readdirSync(tempFolder);
						    if (tempFiles.length >= 10) {
						    	removeDirAllFiles(tempFolder);
						    }

						    if (window.parent.process.platform === 'darwin') {

						    	if ("sketch psd psb ai exr hdr graffle mindnode ppt pptx doc docx xls xlsx numbers key pages".indexOf(ext) > -1) {
						    		if ("sketch exr hdr graffle mindnode ppt pptx doc docx xls xlsx numbers key pages".indexOf(ext) > -1) {
						    			if (size <= 600) {
						    				$("body").addClass("ready");
						    				return;
						    			}
						    			size = Math.max(size, 2048);
						    		}
						    		else {
						    			if (size <= 640) {
						    				$("body").addClass("ready");
						    				return;
						    			}
						    		}
                                    
									if (isAppleSilicon) {
										var ipcRenderer = window.parent.ipcRenderer;
										let tempFilePath = `${tempFolder}/${path.basename(filePath)}.png`;
										console.time("nativeImage.createThumbnailFromPath");
										ipcRenderer.invoke('nativeImage.createThumbnailFromPath', {
											tempFilePath: tempFilePath,
											filePath: filePath,
											size: size,
                                            maxHeight: Math.max(size, 10000)
										}).then(function (result) {
											console.timeEnd("nativeImage.createThumbnailFromPath");
											console.log(result);
											if (fs.existsSync(tempPath)) {
												fs.renameSync(tempPath, finalPath);
												polling(previewLink, 1000);
											}
										});
									}
									else {
										let params = ['-t', '-s', size, '-x', '-F1'];
										params.push(path.resolve(filePath));
										params.push('-o');
										params.push(tempFolder);

										// 避免卡死，如果一个文件超过 30 秒仍无法处理，就触发 Timeout
										var task = spawn('qlmanage', params, { timeout: 20000 });
										task.on('close', function(code) {
											if (fs.existsSync(tempPath)) {
												fs.renameSync(tempPath, finalPath);
												polling(previewLink, 1000);
											}
										});
									}
							    }
						    }
						    else {
						    	
						    }
					    }
					    else {
					    	$("#preview").attr("src", previewLink);
					    	setTimeout(function () {
					    		$("body").addClass("ready");
					    	}, 300);
					    }
					}
				});
			}
			else {

				$(document).ready(function () {

					setTimeout(function () { init(); }, 500);

					function init () {

						var tempPath = path.normalize(tempFolder + "/" + decodeURIComponent(fileName) + ".png.tmp");

						if (Math.min(width, height) < 480) { 
							$("body").addClass("ready");
							return; 
						}

						if (height * width > MAX_DIMENSION) {
							if (height > width) {
								size = parseInt(width * (MAX_DIMENSION / (height * width)));
							}
							else {
								size = parseInt(height * (MAX_DIMENSION / (height * width)));
							}
						}
						console.log("size > "+ size);

						if ("psd psb ai ppt pptx potx".indexOf(ext) === -1) {
					    	$("body").addClass("ready");
					    	return;
						}

						if (size <= 640) {
		    				$("body").addClass("ready");
		    				return;
		    			}
				
					    // 缓存机制

					    // 如果预览图时间 < 当前文件时间，就移除缓存
					    try {
					    	var fp = filePath;
					    	var rawStat = fs.statSync(fp);
					    	var finalStat = fs.statSync(finalPath);
					    	if (rawStat.mtimeMs > finalStat.mtimeMs) {
					    		fs.unlinkSync(finalPath);
					    		console.log("预览图过旧，重新制作");
					    	}
					    }
					    catch (err) {
					    	console.log(err);
					    }

					    if (!fs.existsSync(finalPath)) {
					    	if (!fs.existsSync(tempFolder)) {
						    	fs.mkdirSync(tempFolder);
						    }

						    // 避免太多缓存，超过一定量时，进行清理
						    tempFiles = fs.readdirSync(tempFolder);
						    if (tempFiles.length >= 10) {
						    	removeDirAllFiles(tempFolder);
						    }

						    // 将制作预览图需求传给后台进行处理
				    		var ipcRenderer = window.parent.ipcRenderer;
				    		ipcRenderer.send('generate-hight-resolution-thumbnail', {
				    			filePath: path.normalize(filePath),
				    			tempFile: tempPath,
				    			finalFile: finalPath,
				    			size: size,
				    			ext: ext
				    		});

				    		// 不断轮询是否完成
				    		polling(previewLink, 1000);
					    }
					    else {
					    	$("#preview").attr("src", previewLink);
					    	setTimeout(function () {
					    		$("body").addClass("ready");
					    	}, 300);
					    }
					}
				});
			}

		</script>
	</body>
</html>
