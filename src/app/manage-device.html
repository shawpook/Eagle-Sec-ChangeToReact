<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="css/vendors/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/manage-device.css">
    <script>var appRoot = require('app-root-path');</script>
    <script src="js/vendors/jquery-1.8.0.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/vendors/angular.min.js"></script>
    <script src="js/vendors/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="js/vendors/is.min.js"></script>
    <script src="js/manage-device.js"></script>
    <script>
        window.i18n = new(require(appRoot + '/i18n'));
    </script>
    <style>
        [ng\:cloak], [ng-cloak], [data-ng-cloak], [x-ng-cloak], .ng-cloak, .x-ng-cloak {
          display: none !important;
        }
    </style>
</head>

<body 
    ng-cloak
    ng-app="ManageDeviceApp"
    class="{{::platform}} {{language}}"
    vibrancy="{{::vibrancyEnabled}}"
    theme="{{theme}}"
    platform="{{::platform}}"
    ng-controller="ManageDeviceController"

>

    <!-- 讀取中提示 -->
    <div class="loader" ng-if="isLoading">
        <svg class="spinner" width="40px" height="40px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
            <circle class="path" fill="none" stroke-width="3" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
        </svg>
    </div>

    <div id="manage-device-window" class="manage-device-window">
        <div class="ic-btn manage-device-close" ng-click="close()">
            <img src="assets/images/{{theme|themePath}}/icons/ic-modal-close.svg">
        </div>

        <!-- 插畫 -->
        <div class="illustration">
            <img src="assets/images/{{theme|themePath}}/illustrations/illustration-manage-device.png" width="180" height="96">
        </div>

        <!-- 提示標題 -->
        <div class="title">{{'manageDevice.title' | i18n}} ({{used}}/{{total}})</div>
        <div class="desc" ng-bind-html="desc"></div>

        <!-- 設備清單 -->
        <div class="devices">
            <div class="device" ng-class="{'current': device.isCurrent}" ng-repeat="device in devices">

                <div class="status-icon"></div>

                <div class="platform-icon" ng-if="device.platform === 'Windows_NT'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g opacity="0.5">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.5 12.9091L2 12.2546V8.5H6.5V12.9091ZM7.5 2.93511L14 2L13.9998 7.5H7.5V2.93511ZM6.5 3.07867L2 3.72585V7.5H6.5V3.07867ZM7.5 13.0548V8.5H14V14L7.5 13.0548Z" fill="#2C2F32"/>
                        </g>
                        </svg>
                </div>
                <div class="platform-icon" ng-if="device.platform === 'Darwin'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g opacity="0.5">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10.504 1.78789C10.3697 2.11812 10.1977 2.40849 9.9882 2.65901C9.76501 2.93685 9.48033 3.16687 9.13416 3.34907C8.78799 3.53126 8.46232 3.62236 8.15714 3.62236C8.09337 3.62236 8.03416 3.61553 7.9795 3.60186C7.97495 3.58364 7.96925 3.55176 7.96242 3.50621C7.95559 3.46066 7.95217 3.41056 7.95217 3.3559C7.95217 3.00973 8.02733 2.67267 8.17764 2.34472C8.32795 2.01677 8.49876 1.74348 8.69006 1.52484C8.93602 1.23789 9.24462 0.998758 9.61584 0.807453C9.98706 0.616149 10.3412 0.513665 10.6783 0.5C10.6965 0.577433 10.7056 0.666253 10.7056 0.76646C10.7056 1.11718 10.6384 1.45766 10.504 1.78789ZM9.52019 3.92298C9.81398 3.81822 10.1317 3.76584 10.4733 3.76584C10.5689 3.76584 10.7181 3.77609 10.9208 3.79658C11.1235 3.81708 11.3547 3.86832 11.6143 3.95031C11.8739 4.0323 12.1381 4.16439 12.4068 4.34658C12.6756 4.52878 12.9215 4.78385 13.1447 5.1118C13.1265 5.12547 13.0434 5.18696 12.8953 5.29627C12.7473 5.40559 12.5799 5.56387 12.3932 5.77112C12.2064 5.97836 12.0424 6.24027 11.9012 6.55683C11.76 6.8734 11.6894 7.25031 11.6894 7.68758C11.6894 8.18861 11.7783 8.61222 11.9559 8.95839C12.1335 9.30455 12.3396 9.58468 12.5742 9.79876C12.8088 10.0128 13.0183 10.1688 13.2028 10.2668C13.3873 10.3647 13.4863 10.4159 13.5 10.4205C13.4954 10.4387 13.4613 10.5401 13.3975 10.7245C13.3337 10.909 13.2335 11.1459 13.0969 11.4351C12.9602 11.7243 12.7849 12.0261 12.5708 12.3404C12.3795 12.6182 12.1802 12.8847 11.973 13.1398C11.7657 13.3948 11.5403 13.6032 11.2966 13.7649C11.0529 13.9266 10.7785 14.0075 10.4733 14.0075C10.241 14.0075 10.0429 13.9801 9.87888 13.9255C9.71491 13.8708 9.5589 13.8082 9.41087 13.7376C9.26284 13.667 9.09886 13.6043 8.91894 13.5497C8.73903 13.495 8.51698 13.4677 8.2528 13.4677C7.90663 13.4677 7.61967 13.5144 7.39193 13.6078C7.16418 13.7011 6.94783 13.7934 6.74286 13.8845C6.53789 13.9756 6.2942 14.0211 6.0118 14.0211C5.59275 14.0211 5.22153 13.8526 4.89814 13.5155C4.57474 13.1785 4.24679 12.7754 3.91429 12.3062C3.6501 11.9327 3.41211 11.5023 3.20031 11.0149C2.98851 10.5275 2.81884 10.0106 2.6913 9.46397C2.56377 8.91739 2.5 8.37081 2.5 7.82422C2.5 6.94969 2.66625 6.21408 2.99876 5.61739C3.33126 5.0207 3.756 4.56977 4.27298 4.2646C4.78996 3.95942 5.33085 3.80683 5.89565 3.80683C6.19172 3.80683 6.4707 3.85466 6.73261 3.95031C6.99451 4.04596 7.23934 4.14275 7.46708 4.24068C7.69482 4.33861 7.90207 4.38758 8.08882 4.38758C8.26646 4.38758 8.47598 4.33634 8.71739 4.23385C8.9588 4.13137 9.2264 4.02774 9.52019 3.92298Z" fill="#2C2F32"/>
                    </g>
                    </svg>    
                </div>

                <div class="device-name">{{device.name}}</div>
                <div class="date">{{device.activeAt | date:"yyyy/MM/dd hh:mm"}}</div>
                <div class="ic-btn edit-btn" ng-click="changeName(device)"><img src="assets/images/{{theme|themePath}}/icons/ic-manage-device-edit.svg"></div>
                <div class="ic-btn remove-btn" ng-click="removeDevice(device)"><img src="assets/images/{{theme|themePath}}/icons/ic-manage-device-remove.svg"></div>
            </div>
        </div>
    </div>
</body>
</html>
