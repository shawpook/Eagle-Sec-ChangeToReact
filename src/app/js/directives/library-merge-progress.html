<div class="progress-dialog" ng-class="{'open' : isImporting}" style="width: 400px;">
    <div class="progress-dialog-content" ng-if="isImporting">
        <div class="message">{{'progress.mergingLibrary.msg' | i18n}}... <span class="counter">{{curr}}/{{total}}</span><span class="counter" ng-show="timeLeftInSeconds"> ({{timeLeftInSeconds | second2time}})</span></div>
        <div class="progressbar" ng-show="isImporting">
            <div class="current" style="width: {{curr/total*100}}%;"></div>
        </div>
        <div class="button button-xs button-grey cancel-button" ng-click="cancel()">{{'general.cancel' | i18n}}</div>
    </div>
</div>
<div class="progress-dialog-overlay"></div>
