<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title></title>
		<link rel="stylesheet" href="../css/base.css">
		<link rel="stylesheet" href="../css/jquery-ui.min.css">
		<link rel="stylesheet" href="css/collect-window.css" />
	</head>
	<body>
		<!-- 阶段9b-1：collect-window React 化——Angular（CollectApp/CollectController/四个面板指令/
		     modules）已由 src/app/react/collect-window/* 承接；body 只剩 React 宿主。
		     保留：js/lib/api/*（window.eagle 数据面，fetch 经 shims 重写 41595→测试后端）、
		     vendors（jquery/swal/chinese_convert/pinyinlite/tiny-pinyin，面板引擎与 save 依赖）、
		     models/collect-item.js（plain JS 全局类）。 -->
		<div id="eagle-collect-react-host"></div>

		<script>
			const appRoot = require('app-root-path');
			const settings = require(appRoot + '/my_modules/electron-settings');
			const preferences = settings.getPreferences();
			// 供 React 模块作用域读取（classic 顶层 const 是全局词法绑定，不落 window）
			window.appRoot = appRoot;
			window.settings = settings;
			window.preferences = preferences;
			window.eagle = {};
		</script>
		<script src="js/lib/api/utils.js"></script>
		<script src="js/lib/api/env.js"></script>
		<script src="js/lib/api/crypto.js"></script>
		<script src="js/lib/api/i18n.js"></script>
		<script src="js/lib/api/fetch.js"></script>
		<script src="js/lib/api/url-enlarger.js"></script>
		<script src="js/lib/api/folder.js"></script>
		<script src="js/lib/api/library.js"></script>
		<script src="js/lib/api/tag.js"></script>
		<script src="js/lib/api/item.js"></script>
		<script src="js/lib/api/swal-dialog.js"></script>

		<!-- 外部套件 -->
		<script src="js/vendors/jquery-1.8.0.min.js"></script>
		<script src="js/vendors/jquery-ui.min.js"></script>
		<script src="js/vendors/sweetalert2.all.min.js"></script>
		<script src="js/vendors/chinese_convert.js"></script>
		<script src="js/vendors/pinyinlite.js"></script>
		<script src="js/vendors/tiny-pinyin.js"></script>

		<!-- 模型（plain JS 全局类） -->
		<script src="js/models/collect-item.js"></script>
		<script>window.CollectItem = CollectItem;</script>
	</body>
</html>
