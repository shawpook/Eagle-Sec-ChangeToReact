<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eagle Roadmap Panels</title>
  <!-- M5-1（F22）：地址由当前服务进程在请求期给出，页面本身不含端口常量。 -->
  <script src="/eagle-runtime-config.js"></script>
  <style>
    :root {
      --bg: #131518;
      --panel: #1b1e22;
      --panel-2: #22262b;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --line: #33383f;
      --accent: #4f8cff;
      --green: #3ecf8e;
      --danger: #e26d5a;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .links a { color: var(--accent); margin-left: 10px; text-decoration: none; }
    nav {
      display: flex;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      overflow-x: auto;
    }
    nav button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    nav button.active { border-color: var(--accent); background: #25344d; color: #cfe0ff; }
    main {
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    label { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 54px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button.secondary { background: #3a4149; }
    button.danger { background: var(--danger); }
    button.small { padding: 5px 9px; font-size: 12px; }
    select[multiple] { min-height: 120px; }
    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 12px;
      margin-top: 8px;
    }
    .error { color: var(--danger); }
    .progress-shell {
      height: 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 180ms ease;
    }
    .group {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: var(--panel-2);
    }
    .group .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line);
    }
    .group .list-item:last-child { border-bottom: 0; }
    .plugin-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .plugin-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      padding: 10px;
    }
    .plugin-card .name { font-weight: 600; overflow-wrap: anywhere; }
    .plugin-card .meta { color: var(--muted); font-size: 12px; margin: 6px 0; }
    .result-list { max-height: 320px; overflow: auto; }
    .result-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2b3138;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 860px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
    /* M5-1（F17）：React 挂载点不参与布局，header/nav/main 仍是 body 的直属盒子。 */
    #root { display: contents; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/react/tools/roadmap/entry.tsx"></script>
</body>
</html>
