<div id="resolution-filter-item" ng-right-click="clearResolutionFilter($event)" class="filter-item" ng-class="{'active': isEnabled, 'hide-filter': !isEnabled && !eagle.filter.pinned[item.type]}" filter-item>
    <div class="name" tippy tippy-placement="bottom" tippy-content="{{preferences.shortcuts.keybinds['find.filter.resolution'] | shortcutsWrapper | shortcuts}}"><img ng-src="assets/images/{{theme|themePath}}/icons/context-menu/ic-filter-item-resolution.svg"><div>{{displayName}}</div></div>
    <div class="menu-wrap" close-filter-item><div class="filter-menu" style="min-width: 200px;" ng-mousedown="$event.stopPropagation();">
        <div class="menu-content">
            <div class="image-size-filter">
                <div class="item">
                    <div class="label">{{'filter.resolution>width' | i18n}}</div>
                    <div class="range">
                        <input maxlength="256" type="text" placeholder="{{'filter.resolution>min' | i18n}}" ng-change="changeDisplayName()" ng-model="eagle.filter.filterRules.resolution.minW" ng-model-options="{ debounce: { updateOn: 'default blur', 'default': 300, 'blur': 0 } }">
                        -
                        <input maxlength="256" type="text" placeholder="{{'filter.resolution>max' | i18n}}" ng-change="changeDisplayName()" ng-model="eagle.filter.filterRules.resolution.maxW" ng-model-options="{ debounce: { updateOn: 'default blur', 'default': 300, 'blur': 0 } }">
                    </div>
                </div>
                <div class="item">
                    <div class="label">{{'filter.resolution>height' | i18n}}</div>
                    <div class="range">
                        <input maxlength="256" type="text" placeholder="{{'filter.resolution>min' | i18n}}" ng-change="changeDisplayName()" ng-model="eagle.filter.filterRules.resolution.minH" ng-model-options="{ debounce: { updateOn: 'default blur', 'default': 300, 'blur': 0 } }">
                        -
                        <input maxlength="256" type="text" placeholder="{{'filter.resolution>max' | i18n}}" ng-change="changeDisplayName()" ng-model="eagle.filter.filterRules.resolution.maxH" ng-model-options="{ debounce: { updateOn: 'default blur', 'default': 300, 'blur': 0 } }">
                    </div>
                </div>
            </div>
        </div>
    </div></div>
    <div class="clear-btn" ng-click="clearResolutionFilter($event)"><img ng-src="assets/images/{{theme|themePath}}/icons/ic-filter-clear-btn.png"></div>
</div>
