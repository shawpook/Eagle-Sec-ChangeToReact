<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eagle Text Preview</title>
  <link rel="stylesheet" href="css/text-editor.css">
</head>
<body class="readonly">
  <header class="toolbar">
    <div class="file-title" id="fileTitle">Loading text file...</div>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button id="editButton" type="button" disabled>Edit</button>
      <button id="saveButton" type="button" hidden>Save</button>
      <button id="cancelButton" type="button" hidden>Cancel</button>
      <button id="undoButton" type="button" hidden>Undo</button>
    </div>
  </header>
  <main id="preview" class="preview" aria-live="polite"></main>
  <textarea id="editor" class="editor" hidden spellcheck="false"></textarea>
  <div class="status" id="status" hidden></div>
  <footer class="pager" id="pager" hidden>
    <button id="loadAll" type="button" hidden>Load all</button>
    <button id="loadMore" type="button">Load more</button>
    <span id="pageInfo"></span>
  </footer>
  <script src="text-editor.js"></script>
</body>
</html>
